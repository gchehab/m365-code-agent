name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: m365-code-agent-vsix
          path: dist/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vscode-test-report
          include-hidden-files: true
          path: |
            .test-output/integration-*/vscode-test.log
            .test-output/integration-*/workspace/vscode-test-result.json
